services:
  postgres:
    image: postgres:16-alpine
    container_name: dakpion-postgres-dev
    environment:
      POSTGRES_DB: dakpion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2003"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dakpion"]
      interval: 5s
      timeout: 5s
      retries: 5
