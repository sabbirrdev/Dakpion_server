# DakPion Backend Service — application.properties
# Active Profile: Defaults to 'local', can be overridden with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── JPA / Datasource ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Dakpion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2003}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ── Flyway Configuration ──────────────────────────────────────────────────────
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── DakPion Product Configuration ─────────────────────────────────────────────
dakpion.security.phone-pepper=${DAKPION_PHONE_PEPPER:dakpion-nostalgic-postbox-pepper-secret-2026}
dakpion.otp.ttl-seconds=300
dakpion.otp.rate-limit.window-seconds=60
dakpion.otp.rate-limit.hourly-limit=5
dakpion.moderation.auto-approve-digital=false
dakpion.sms.provider=${DAKPION_SMS_PROVIDER:noop}
dakpion.courier.provider=${DAKPION_COURIER_PROVIDER:noop}

# ── Actuator & Observability ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ── JWT Security ──────────────────────────────────────────────────────────────
app.jwt-secret=${APP_JWT_SECRET:3fca397df901b8cd7a486b62c4d43b14d397318a8bfce625718712fc48b71cd3}
app-jwt-expiration-milliseconds=${APP_JWT_EXPIRATION:7200000}

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── SSLCommerz Payment Gateway ────────────────────────────────────────────────
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:msrte686a99e1b76ab}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:msrte686a99e1b76ab@ssl}
sslcommerz.init-url=${SSLCOMMERZ_INIT_URL:https://sandbox.sslcommerz.com/gwprocess/v4/api.php}
sslcommerz.success-url=${SSLCOMMERZ_SUCCESS_URL:https://dakpion-server.onrender.com/api/v1/payments/success}
sslcommerz.fail-url=${SSLCOMMERZ_FAIL_URL:https://dakpion-server.onrender.com/api/v1/payments/fail}
sslcommerz.cancel-url=${SSLCOMMERZ_CANCEL_URL:https://dakpion-server.onrender.com/api/v1/payments/cancel}

# ── SMTP (Email OTP fallback — not primary for DakPion) ──────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@example.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.docker.compose.enabled=false